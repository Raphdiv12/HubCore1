<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard · HubCore CMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◯</text></svg>">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="admin-layout" id="admin-app">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-wordmark">HubCore</span>
        <span class="sidebar-label">Digital Atelier CMS</span>
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-link is-active" data-view="overview" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Overview
        </button>
        <button class="sidebar-link" data-view="projects" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          Projects & Works
        </button>
        <button class="sidebar-link" data-view="journal" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Journal
        </button>
        <button class="sidebar-link" data-view="homepage" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Homepage Content
        </button>
        <button class="sidebar-link" data-view="media" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Media Library
        </button>

        <div class="sidebar-divider"></div>

        <a href="/" target="_blank" rel="noopener" class="sidebar-link" style="text-decoration:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Public Site &rarr;
        </a>
      </nav>

      <div class="sidebar-footer">
        <p class="sidebar-user" id="current-user-email">admin@hubcore.design</p>
        <button class="sidebar-link" id="btn-logout" type="button" style="padding-left:0; color:var(--error);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Topbar -->
    <header class="admin-topbar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation" type="button">☰</button>
      <h1 class="topbar-title" id="view-title">Overview</h1>
      <div class="topbar-actions" id="topbar-actions">
        <!-- Dynamic per-view actions injected here -->
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="admin-main" id="view-container">
      <div class="admin-loading">Verifying administrator authorization…</div>
    </main>
  </div>

  <script type="module" src="/admin/js/main.js"></script>
</body>
</html>
