      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#262a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a36"/>
      <stop offset="0.7" stop-color="#e2361b"/>
      <stop offset="1" stop-color="#a81f10"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
