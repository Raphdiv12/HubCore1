  <circle cx="700" cy="380" r="210" fill="url(#glow)"/>
  <circle cx="560" cy="420" r="250" fill="none" stroke="#f4f1ea" stroke-width="14"/>
  <rect x="120" y="560" width="960" height="6" fill="#f4f1ea"/>
