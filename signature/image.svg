  <rect x="884" y="144" width="172" height="92" fill="none" stroke="#f4f1ea" stroke-width="4"/>
  <g fill="#f4f1ea" font-family="Helvetica, Arial, sans-serif" font-weight="700">
    <text x="120" y="190" font-size="96" letter-spacing="-2">HUBCORE</text>
    <text x="122" y="236" font-size="22" letter-spacing="8" font-weight="400" opacity="0.8">SIGNATURE / 01</text>
    <text x="120" y="680" font-size="18" letter-spacing="6" font-weight="400" opacity="0.7">STATE A — STATE B</text>
