<!DOCTYPE html>
<html lang="en" class="page-contact">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · HubCore</title>
  <meta name="description" content="Contact HubCore, an independent digital atelier. Tell us what you're making.">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/contact.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◯</text></svg>">
</head>
<body class="page-contact">

  <a href="#main" class="skip-link">Skip to content</a>

  <nav id="nav" class="is-visible" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="nav-wordmark" id="nav-wordmark">HubCore</a>
      <ul class="nav-links">
        <li><a href="/works/" class="nav-link" id="nav-work">Work</a></li>
        <li><a href="/atelier/" class="nav-link" id="nav-atelier">Atelier</a></li>
        <li><a href="/contact/" class="nav-link is-active" id="nav-contact" aria-current="page">Contact</a></li>
      </ul>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-overlay">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
    <div class="nav-overlay" id="nav-overlay">
      <a href="/works/" class="overlay-link">Work</a>
      <a href="/atelier/" class="overlay-link">Atelier</a>
      <a href="/contact/" class="overlay-link" aria-current="page">Contact</a>
    </div>
  </nav>

  <main id="main">
    <section class="contact" aria-labelledby="contact-title">
      <div class="grid contact-grid">

        <h1 class="contact-h1" id="contact-title">
          <span class="line"><span class="line-inner">Tell us what</span></span>
          <span class="line"><span class="line-inner">you're making.</span></span>
        </h1>

        <div class="contact-aside">
          <p class="contact-note">A few lines is enough to begin.</p>
          <div class="contact-direct">
            <p class="contact-direct-label">Or write directly</p>
            <a href="mailto:hello@hubcore.design" class="contact-email">hello@hubcore.design</a>
          </div>
        </div>

        <!--
          Delivery: set data-endpoint to a form service URL (e.g. a Formspree
          form endpoint) to send messages from the page. When empty, the form
          composes the message in the visitor's email app via mailto.
        -->
        <form
          id="contact-form"
          class="contact-form"
          action="mailto:hello@hubcore.design"
          method="post"
          enctype="text/plain"
          data-endpoint=""
        >
          <div class="field" id="field-name-wrap">
            <label for="field-name" class="field-label">Name</label>
            <input type="text" id="field-name" name="name" class="field-input" required autocomplete="name" aria-describedby="error-name">
            <span class="field-error" id="error-name"></span>
          </div>

          <div class="field" id="field-email-wrap">
            <label for="field-email" class="field-label">Email</label>
            <input type="email" id="field-email" name="email" class="field-input" required autocomplete="email" aria-describedby="error-email">
            <span class="field-error" id="error-email"></span>
          </div>

          <div class="field field-wide" id="field-message-wrap">
            <label for="field-message" class="field-label">What are you working on?</label>
            <textarea id="field-message" name="message" class="field-input field-textarea" rows="4" required aria-describedby="error-message"></textarea>
            <span class="field-error" id="error-message"></span>
          </div>

          <div class="form-foot">
            <button type="submit" class="contact-submit" id="contact-submit">
              <span class="submit-label">Send message</span>
              <svg class="submit-arrow" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M2 8h11M9 4l4 4-4 4"/>
              </svg>
            </button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </div>
        </form>

      </div>
    </section>
  </main>

  <footer id="footer" role="contentinfo">
    <div class="grid footer-grid">
      <p class="footer-copy">&copy; 2026 HubCore. Independent Digital Atelier.</p>
      <div class="footer-nav">
        <a href="/" class="footer-link">Home</a>
        <a href="/works/" class="footer-link">Work</a>
        <a href="/atelier/" class="footer-link">Atelier</a>
        <a href="/contact/" class="footer-link is-active" aria-current="page">Contact</a>
      </div>
    </div>
  </footer>

  <script type="module" src="/contact.js"></script>
</body>
</html>
